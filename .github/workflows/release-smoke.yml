name: Release smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    container: python:3.12-slim
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install and test the released wheel
        run: |
          python - <<'PY'
          import subprocess
          import sys
          import tomllib

          with open("pyproject.toml", "rb") as source:
              version = tomllib.load(source)["project"]["version"]
          wheel = (
              "https://github.com/golergka/coloph-agent-inspect/releases/download/"
              f"v{version}/coloph_agent_inspect-{version}-py3-none-any.whl"
          )
          subprocess.run([
              sys.executable, "-m", "pip", "install", "--no-cache-dir",
              f"coloph-agent-inspect[codex] @ {wheel}",
          ], check=True)
          PY
          python -m unittest discover -s tests -v
